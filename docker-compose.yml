services:
  # ============================================================================
  # 1. Primary Relational Database (Users, Friendships, Posts)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: newsfeed-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-newsfeed_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-newsfeed_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - newsfeed-net

  # ============================================================================
  # 2. Redis In-Memory Cache (User Feed ZSets, Post Hash Cache, Profile Cache)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: newsfeed-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - newsfeed-net

  # ============================================================================
  # 3. Apache Kafka (KRaft mode: asynchronous fan-out message streaming)
  # ============================================================================
  kafka:
    image: apache/kafka:latest
    container_name: newsfeed-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - newsfeed-net

  # ============================================================================
  # 4. Redis Visualizer (Inspect Keys, Feed Sorted Sets, TTLs)
  # ============================================================================
  # 4. Redis Visualizer (Inspect Keys, Feed Sorted Sets, TTLs)
  # ============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: newsfeed-redis-commander
    restart: unless-stopped
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      REDIS_HOSTS: cache:redis:6379,graph:redis-graph:6379
    depends_on:
      redis:
        condition: service_healthy
      redis-graph:
        condition: service_healthy
    networks:
      - newsfeed-net

  # ============================================================================
  # 5. Kafka UI (Inspect Topics, Consumer Groups, Fan-out Messages)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: newsfeed-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-newsfeed-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - newsfeed-net

  # ============================================================================
  # 6. Social Graph Database (RedisGraph: In-Memory Graph with Cypher)
  # ============================================================================
  redis-graph:
    image: redislabs/redisgraph:latest
    container_name: newsfeed-redis-graph
    restart: unless-stopped
    ports:
      - "${REDIS_GRAPH_PORT:-6380}:6379"
    volumes:
      - redis_graph_data:/data
      - ./docker/redisgraph/init.cypher:/scripts/init.cypher:ro
      - ./docker/redisgraph/seed.sh:/scripts/seed.sh:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - newsfeed-net

  # ============================================================================
  # 7. ASP.NET Core 10 Web API (Feed Publishing & Retrieval REST API)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: newsfeed-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-newsfeed_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_GRAPH_HOST: redis-graph
      REDIS_GRAPH_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: post.created
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-graph:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newsfeed-net

  # ============================================================================
  # 8. .NET 10 Fan-out Worker (Kafka Consumer & Redis Feed Cache Updater)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: newsfeed-worker
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-newsfeed_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_GRAPH_HOST: redis-graph
      REDIS_GRAPH_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: post.created
      KAFKA_GROUP_ID: newsfeed-fanout-workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-graph:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - newsfeed-net

networks:
  newsfeed-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  redis_graph_data:
